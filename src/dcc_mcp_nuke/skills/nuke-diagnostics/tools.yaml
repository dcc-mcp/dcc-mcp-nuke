tools:
  - name: ping
    description: Prove read-only Nuke host and main-thread readiness.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    output_schema:
      type: object
      required: [ready, dcc, host_version, gui]
      properties:
        ready: {type: boolean}
        dcc: {type: string, const: nuke}
        host_version: {type: string}
        gui: {type: boolean}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 5
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [read-only, diagnostics]
    source_file: scripts/ping.py
  - name: host_flavor
    description: >-
      Report the running Nuke entry point (nuke, nukex, or nukestudio) and the
      declared host surface plus non-authorizing runtime API observations. Read-only; use it to assess whether
      Studio-only skills can load before calling `load_skill`.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    output_schema:
      type: object
      required: [flavor, dcc, capabilities, signals]
      properties:
        flavor: {type: string, enum: [nuke, nukex, nukestudio]}
        dcc: {type: string, const: nuke}
        gui: {type: boolean}
        host_version: {type: string}
        executable: {type: string}
        hiero_importable: {type: boolean}
        signals:
          type: array
          items: {type: string}
        capabilities:
          type: array
          items: {type: string}
        capabilities_semantics: {type: string}
        runtime_evidence:
          type: object
          description: Loaded-module attribute observations only; never grants execution permission.
          required: [scope, surfaces, license_status, native_verification, authorizes_execution]
          properties:
            scope: {type: string, const: already_loaded_module_attributes_only}
            license_status: {type: string, const: unknown}
            native_verification: {type: string, const: not_performed}
            authorizes_execution: {type: boolean, const: false}
            surfaces:
              type: object
              additionalProperties:
                type: object
                required: [module, state, callable_attributes, unobserved_attributes]
                properties:
                  module: {type: string}
                  state: {type: string, enum: [not_loaded, observed, incomplete]}
                  callable_attributes: {type: array, items: {type: string}}
                  unobserved_attributes: {type: array, items: {type: string}}
        studio_capabilities:
          type: array
          items: {type: string}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 5
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [read-only, diagnostics, host-flavor]
    source_file: scripts/host_flavor.py
  - name: diagnose_dependencies
    description: >-
      Read-only post-install diagnosis of missing Python modules and node
      classes from the running Nuke interpreter. Reports stage, facts, explicit
      certainty and repair hints without installing, importing or loading
      anything, and without reading credentials or environment values.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        required_modules:
          type: array
          maxItems: 256
          items: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_.]{0,127}$'}
        required_node_classes:
          type: array
          maxItems: 256
          items: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_.:-]{0,127}$'}
        max_items: {type: integer, minimum: 1, maximum: 256}
    output_schema:
      type: object
      required: [scope, interpreter, modules, module_probe, node_classes, issues, issue_counts, safety]
      properties:
        scope: {type: string}
        interpreter: {type: object}
        modules: {type: array, items: {type: object}}
        module_probe: {type: object}
        node_classes: {type: array, items: {type: object}}
        plugin_kinds_observed: {type: array, items: {type: string}}
        plugin_inventory_available: {type: boolean}
        version: {type: object}
        comfyui: {type: object}
        existing_capabilities: {type: object}
        issues: {type: array, items: {type: object}}
        issue_counts: {type: object}
        safety: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [read-only, diagnostics, install-sop]
    source_file: scripts/diagnose_dependencies.py
  - name: describe_execution_sources
    description: >-
      Static, secret-free report of where this adapter executes work and an
      explicit statement that it adds no cloud model, provider, billing,
      API-key or paid-call surface. Read-only; makes no network calls, reads
      no keys and performs no native host verification.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    output_schema:
      type: object
      required: [scope, local_host, optional_local_native_subprocess, external_services, no_cloud_integration, no_billing_estimates, no_api_keys, native_host_verification]
      properties:
        scope: {type: string}
        local_host: {type: object}
        optional_local_native_subprocess: {type: object}
        external_services: {type: object}
        no_cloud_integration: {type: boolean}
        no_billing_estimates: {type: boolean}
        no_api_keys: {type: boolean}
        native_host_verification: {type: string}
        unknowns: {type: array, items: {type: string}}
        credentials_read: {type: boolean}
        environment_values_returned: {type: boolean}
        private_paths_returned: {type: boolean}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 5
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [read-only, diagnostics, billing-transparency]
    source_file: scripts/describe_execution_sources.py
