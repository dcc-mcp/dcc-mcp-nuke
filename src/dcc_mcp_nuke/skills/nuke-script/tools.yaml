tools:
  - name: open_script
    description: Open an existing absolute .nk path and verify the loaded Root and graph. Refuse an adjacent .autosave recovery file before clearing the graph to avoid a modal recovery prompt.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, description: Absolute path to an existing .nk script.}
        discard_unsaved_changes:
          type: boolean
          default: false
          description: Explicitly allow replacing a modified current script without saving it.
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/open_script.py
  - name: inspect_script
    description: Inspect the active Nuke script, frame range, and selected nodes without changing it.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_script.py
  - name: list_nodes
    description: List bounded node identities, input topology, and non-executable knob values without modifying the graph.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        max_nodes: {type: integer, minimum: 1, maximum: 1000, default: 256}
        max_knobs_per_node: {type: integer, minimum: 0, maximum: 128, default: 64}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_nodes.py
  - name: inspect_read_nodes
    description: Inspect Read file paths, frame ranges, multipart EXR parts, and a bounded channel sample without changing the script.
    input_schema:
      type: object
      properties:
        node_name: {type: string, minLength: 1, description: Optional exact Read node name.}
        channel_limit: {type: integer, minimum: 1, maximum: 2048, default: 256}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/inspect_read_nodes.py
  - name: sample_channel_statistics
    description: Sample bounded per-channel min, max, mean, all-zero, and non-finite diagnostics on one Nuke image frame without changing the script.
    input_schema:
      type: object
      required: [node_name, channels]
      properties:
        node_name: {type: string, minLength: 1, description: Exact image node name.}
        channels:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Exact channel names or layer names expanded from the node's available channels.
        frame: {type: integer, description: Frame to evaluate; defaults to the current frame.}
        roi:
          type: object
          required: [x, y, width, height]
          additionalProperties: false
          properties:
            x: {type: integer}
            y: {type: integer}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
        max_samples_per_channel:
          type: integer
          minimum: 1
          maximum: 4096
          default: 1024
          description: Maximum uniform filtered tile samples evaluated for each resolved channel.
        zero_epsilon: {type: number, minimum: 0, default: 0, description: Absolute threshold used by all_zero.}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/sample_channel_statistics.py
  - name: save_script
    description: Save the current Nuke script to an explicit absolute .nk path.
    input_schema:
      type: object
      required: [path]
      properties: {path: {type: string, description: Absolute .nk output path.}}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/save_script.py
  - name: get_root_settings
    description: >-
      Read the active Nuke Root frame range, fps, format, and a bounded enumerated
      format list. Read-only; does not change the script.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        max_formats: {type: integer, minimum: 1, maximum: 512, default: 128}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/get_root_settings.py
  - name: set_root_settings
    description: >-
      Set one or more Nuke Root settings (frame range, fps, format) from bounded,
      validated values and verify each readback; reject an empty request, an invalid
      range, or a format outside the enumerated list.
    input_schema:
      type: object
      additionalProperties: false
      description: At least one of first_frame, last_frame, fps, or format is required.
      properties:
        first_frame: {type: integer, minimum: -1000000000, maximum: 1000000000, description: Start frame (may be negative for handles); must not exceed the effective last frame.}
        last_frame: {type: integer, minimum: -1000000000, maximum: 1000000000, description: End frame (may be negative); must not be below the effective first frame.}
        fps: {type: number, exclusiveMinimum: 0, maximum: 1000, description: Playback frame rate.}
        format: {type: string, minLength: 1, maxLength: 256, description: Exact format name from the enumerated format list.}
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_root_settings.py
    next-tools:
      on-success:
        - nuke_script__get_root_settings
  - name: new_script
    description: >-
      Clear the current Nuke graph and start a fresh script, optionally applying
      Root frame range, fps, and format. Guards unsaved changes unless
      discard_unsaved_changes is true; frame range bounds must be provided together.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        discard_unsaved_changes:
          type: boolean
          default: false
          description: Explicitly allow clearing a modified current script without saving it.
        first_frame: {type: integer, minimum: -1000000000, maximum: 1000000000, description: Start frame (may be negative for handles); must be provided together with last_frame.}
        last_frame: {type: integer, minimum: -1000000000, maximum: 1000000000, description: End frame (may be negative); must be provided together with first_frame.}
        fps: {type: number, exclusiveMinimum: 0, maximum: 1000, description: Playback frame rate.}
        format: {type: string, minLength: 1, maxLength: 256, description: Exact format name from the enumerated format list.}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/new_script.py
    next-tools:
      on-success:
        - nuke_script__inspect_script
  - name: paste_nodes
    description: >-
      Paste nodes from an absolute .nk node-paste file into the current Nuke graph
      without clearing existing nodes; report the bounded added-node identities and
      fail closed if any pre-existing node would be lost.
    input_schema:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: {type: string, description: Absolute path to an existing .nk node-paste file.}
        max_reported_nodes: {type: integer, minimum: 1, maximum: 1000, default: 256}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/paste_nodes.py
    next-tools:
      on-success:
        - nuke_script__list_nodes
