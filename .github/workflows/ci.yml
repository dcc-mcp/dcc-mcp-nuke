name: CI
on:
  push: {branches: [main, "release-please--branches--**"]}
  pull_request: {branches: [main]}
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest], python: ["3.9", "3.10", "3.11", "3.12", "3.13"], exclude: [{os: windows-latest, python: "3.9"}, {os: macos-latest, python: "3.9"}]}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e ".[dev]"
      - name: Install lifecycle smoke
        run: python -m pytest tests/test_install_lifecycle.py
      - run: python -m pytest
  # The pinned upper bound keeps the main matrix reproducible, but it also hides
  # incompatibilities until a bump lands. This job deliberately runs against the newest
  # published Core -- including versions the pin excludes -- so a Core minor that breaks the
  # Install SOP contract shows up here instead of silently landing in the main matrix.
  core-latest:
    name: core-latest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - name: Resolve newest Core
        id: core
        run: |
          python -m pip install --upgrade pip
          version=$(python -m pip index versions dcc-mcp-core \
            | tr ',' '\n' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          # Fail loudly here rather than silently testing an empty pin: this job exists only
          # to warn about new Core releases, so a run that resolved nothing would otherwise
          # still report success.
          if [ -z "${version}" ]; then
            echo "::error::could not resolve newest dcc-mcp-core version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dcc-mcp-core ${version}"
      - name: Install adapter with newest Core
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "dcc-mcp-core==${{ steps.core.outputs.version }}"
          python -m pip show dcc-mcp-core
      - name: Install SOP contract against newest Core
        run: python -m pytest tests/test_install_lifecycle.py -v --tb=short
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build && python -m twine check dist/*
      - name: Verify wheel and sdist with minimum Core
        run: python tools/verify_distribution.py dist --core-version 0.20.14
