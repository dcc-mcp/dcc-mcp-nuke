name: Release
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      release_commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Resolve immutable release identity
        id: resolve
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          python tools/release_integrity.py resolve
          --tag "$RELEASE_TAG"
          --main-ref origin/main
          --identity "$RUNNER_TEMP/release-identity.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Install hash-pinned build inputs
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r .github/release-requirements.txt
      - name: Build wheel and source archive
        run: python -m build --no-isolation
      - name: Create digest-bound release bundle
        id: bundle
        run: >-
          python tools/release_integrity.py create-bundle
          --dist dist
          --identity "$RUNNER_TEMP/release-identity.json"
          --bundle "$RUNNER_TEMP/release-bundle.zip"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload one immutable handoff
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-${{ steps.resolve.outputs.commit }}
          path: ${{ runner.temp }}/release-bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-nuke
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Download the exact build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-handoff
      - name: Final source and artifact identity recheck
        run: >-
          python tools/release_integrity.py verify-bundle
          --main-ref origin/main
          --bundle "$RUNNER_TEMP/release-handoff/release-bundle.zip"
          --expected-bundle-sha256 "${{ needs.build.outputs.bundle_sha256 }}"
          --extract "$RUNNER_TEMP/verified-release"
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/verified-release/dist
          verify-metadata: true
          print-hash: true
